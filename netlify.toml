[build]
  base    = "web"
  command = "npm run build"
  publish = "web/out"

# Disable Netlify post-processing (Next.js already optimizes)
[build.processing]
  skip_processing = true

# Extra safety: explicitly disable each category
[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.images]
  compress = false

[build.processing.html]
  pretty_urls = false